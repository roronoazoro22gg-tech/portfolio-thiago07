<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="secao">
        <h1>Calculadora</h1>

        <input type="number" id="num1" placeholder="Primeiro número">
        <input type="number" id="num2" placeholder="Segundo número">

        <button onclick="somar()">Somar</button>
        <button onclick="subtrair()">Subtrair</button>
        <button onclick="multiplicar()">Multiplicar</button>
        <button onclick="dividir()">Dividir</button>

        <h2 id="resultado">Resultado:</h2>

        <br>
        <a href="index.html">Voltar ao Portfólio</a>
    </section>

    <script>
        function somar() {
            calcular("+");
        }

        function subtrair() {
            calcular("-");
        }

        function multiplicar() {
            calcular("*");
        }

        function dividir() {
            calcular("/");
        }

        function calcular(operacao) {
            const n1 = Number(document.getElementById("num1").value);
            const n2 = Number(document.getElementById("num2").value);
            let resultado = 0;

            if (operacao === "+") resultado = n1 + n2;
            if (operacao === "-") resultado = n1 - n2;
            if (operacao === "*") resultado = n1 * n2;

            if (operacao === "/") {
                if (n2 === 0) {
                    document.getElementById("resultado").innerHTML = "Não é possível dividir por zero!";
                    return;
                }
                resultado = n1 / n2;
            }

            document.getElementById("resultado").innerHTML = "Resultado: " + resultado;
        }
    </script>

</body>
</html>
